name: musify
description: "A modern music player app built with Flutter and BLoC pattern"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.2

dependencies:
  # Core Flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management - BLoC
  flutter_bloc: ^8.1.4
  bloc: ^8.1.3
  equatable: ^2.0.5

  # Audio & Media
  just_audio: ^0.10.3

  # File & Storage
  file_picker: ^10.1.9
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3
  permission_handler: ^12.0.0+1

  # UI & Design
  flex_color_scheme: ^8.2.0
  font_awesome_flutter: ^10.8.0
  marquee: ^2.3.0

  # Utilities

  audiotags: ^1.4.5
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.6

flutter:
  uses-material-design: true
